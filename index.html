<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Babylonian to Hindu-Arabic Numerals</title>

  <style>
    :root {
      --page-bg: #f4f7fb;
      --card: #ffffff;
      --panel: #f8fafc;

      --text: #172033;
      --muted: #667085;

      --border: #dbe2ea;
      --border-dark: #cbd5e1;

      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eff6ff;

      --green: #166534;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;

      --red: #991b1b;
      --red-bg: #fff7f7;
      --red-border: #fecaca;

      --shadow:
        0 1px 2px rgba(16, 24, 40, 0.04),
        0 4px 14px rgba(16, 24, 40, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--page-bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1000px, calc(100% - 32px));
      margin: 32px auto;
    }

    .card {
      padding: 22px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: var(--shadow);
    }

    /* ==================================================
       PROMPT
       ================================================== */

    .instruction {
      text-align: center;

      color: var(--muted);

      font-size: 1rem;
      line-height: 1.45;
    }

    .subinstruction {
      margin-top: 5px;

      text-align: center;

      color: var(--muted);

      font-size: 0.84rem;
      line-height: 1.45;
    }

    /* ==================================================
       BABYLONIAN NUMERAL
       ================================================== */

    .display-wrap {
      display: flex;
      justify-content: center;

      margin: 24px 0;
    }

    .babylonian-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;

      min-height: 130px;

      padding: 16px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--panel);
    }

    .place-group {
      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 112px;
      min-height: 100px;

      padding: 8px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--card);
    }

    .babylonian-digit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    svg {
      display: block;
      overflow: visible;
    }

    /* ==================================================
       ANSWER
       ================================================== */

    .answer-label {
      display: block;

      margin-bottom: 7px;

      text-align: center;

      color: var(--muted);

      font-size: 0.86rem;
      font-weight: 650;
    }

    .input-wrap {
      display: flex;
      justify-content: center;
    }

    .answer-input {
      width: min(100%, 260px);
      min-height: 56px;

      padding: 8px 12px;

      border: 1.5px solid var(--border-dark);
      border-radius: 10px;

      background: var(--card);
      color: var(--text);

      text-align: center;

      font-size: 1.4rem;
      font-weight: 700;
    }

    .answer-input:focus {
      outline: none;

      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* ==================================================
       BUTTONS
       ================================================== */

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;

      margin-top: 18px;
    }

    .button {
      min-height: 44px;

      padding: 9px 19px;

      border-radius: 9px;

      font-weight: 700;

      cursor: pointer;
    }

    .primary {
      background: var(--blue);
      color: white;

      border: 1px solid var(--blue);
    }

    .primary:hover:not(:disabled) {
      background: var(--blue-dark);
    }

    .secondary {
      background: var(--card);
      color: var(--text);

      border: 1px solid var(--border);
    }

    .secondary:hover {
      background: var(--panel);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* ==================================================
       FEEDBACK
       ================================================== */

    .feedback {
      display: none;

      margin-top: 18px;

      border-radius: 12px;

      overflow: hidden;
    }

    .feedback.correct {
      display: block;

      padding: 15px 17px;

      background: var(--green-bg);
      color: var(--green);

      border: 1px solid var(--green-border);
    }

    .feedback.incorrect {
      display: block;

      background: var(--red-bg);
      color: var(--text);

      border: 1px solid var(--red-border);
    }

    .feedback-head {
      padding: 15px 17px;

      color: var(--red);

      line-height: 1.5;
    }

    /* ==================================================
       EXPLANATION
       ================================================== */

    .explanation {
      padding: 16px 17px;

      border-top: 1px solid var(--red-border);

      background: white;
    }

    .explanation-title {
      margin-bottom: 12px;

      font-weight: 750;
    }

    .breakdown {
      display: grid;
      gap: 9px;
    }

    .break-row {
      display: grid;
      grid-template-columns:
        minmax(90px, 0.7fr)
        minmax(110px, 1fr)
        minmax(90px, 0.7fr);

      gap: 8px;
      align-items: center;

      padding: 10px 12px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--panel);
    }

    .break-small {
      color: var(--muted);

      font-size: 0.78rem;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .break-math {
      text-align: center;

      font-weight: 700;
    }

    .break-value {
      text-align: right;

      font-weight: 800;
    }

    .sum-box {
      margin-top: 12px;

      padding: 12px;

      border-radius: 9px;

      background: var(--blue-soft);

      text-align: center;

      font-weight: 750;
      line-height: 1.5;
    }

    /* ==================================================
       REFERENCE
       ================================================== */

    .reference {
      margin-top: 20px;
      padding-top: 16px;

      border-top: 1px solid var(--border);
    }

    .reference-title {
      margin-bottom: 11px;

      text-align: center;

      color: var(--muted);

      font-size: 0.78rem;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .reference-grid {
      display: flex;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .reference-item {
      display: flex;
      align-items: center;
      gap: 9px;

      padding: 8px 12px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--panel);
    }

    .reference-note {
      margin-top: 11px;

      text-align: center;

      color: var(--muted);

      font-size: 0.8rem;
      line-height: 1.45;
    }

    /* ==================================================
       RESPONSIVE
       ================================================== */

    @media (max-width: 560px) {

      .app {
        width: min(100% - 18px, 1000px);
        margin: 18px auto;
      }

      .card {
        padding: 16px;
      }

      .place-group {
        min-width: 96px;
      }

      .break-row {
        grid-template-columns: 1fr;

        text-align: center;
      }

      .break-value {
        text-align: center;
      }

    }
  </style>
</head>

<body>

<main class="app">

  <section class="card">

    <!-- ==================================================
         PROMPT
         ================================================== -->

    <div class="instruction">
      Write this Babylonian numeral as a Hindu-Arabic numeral.
    </div>

    <div class="subinstruction">
      Each separated box represents one base-60 place.
    </div>


    <!-- ==================================================
         BABYLONIAN NUMERAL
         ================================================== -->

    <div class="display-wrap">

      <div
        id="babylonianDisplay"
        class="babylonian-display"
        aria-label="Babylonian numeral">
      </div>

    </div>


    <!-- ==================================================
         ANSWER
         ================================================== -->

    <label
      class="answer-label"
      for="answerInput">
      Hindu-Arabic numeral
    </label>

    <div class="input-wrap">

      <input
        id="answerInput"
        class="answer-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Answer">

    </div>


    <!-- ==================================================
         CONTROLS
         ================================================== -->

    <div class="actions">

      <button
        id="checkButton"
        class="button primary"
        type="button">
        Check Answer
      </button>

      <button
        id="nextButton"
        class="button secondary"
        type="button">
        Next Question
      </button>

    </div>


    <!-- ==================================================
         FEEDBACK
         ================================================== -->

    <div
      id="feedback"
      class="feedback"
      aria-live="polite">
    </div>


    <!-- ==================================================
         REFERENCE
         ================================================== -->

    <div class="reference">

      <div class="reference-title">
        Babylonian Symbol Reference
      </div>

      <div class="reference-grid">

        <div class="reference-item">

          <span id="oneReference"></span>

          <strong>
            = 1
          </strong>

        </div>

        <div class="reference-item">

          <span id="tenReference"></span>

          <strong>
            = 10
          </strong>

        </div>

      </div>

      <div class="reference-note">

        Symbols within one group combine to make a value from 1 to 59.
        Groups then use base-60 place values.

      </div>

    </div>

  </section>

</main>


<script>

(() => {

  /*
    ==================================================
    DOM
    ==================================================
  */

  const babylonianDisplay =
    document.getElementById(
      "babylonianDisplay"
    );


  const answerInput =
    document.getElementById(
      "answerInput"
    );


  const checkButton =
    document.getElementById(
      "checkButton"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  const feedbackElement =
    document.getElementById(
      "feedback"
    );


  const oneReference =
    document.getElementById(
      "oneReference"
    );


  const tenReference =
    document.getElementById(
      "tenReference"
    );


  /*
    ==================================================
    STATE
    ==================================================
  */

  let currentNumber =
    1;


  let currentDigits =
    [1];


  let previousNumber =
    null;


  /*
    ==================================================
    BABYLONIAN WEDGES
    ==================================================

    These use the textbook-style forms:

    1:
      vertical wedge

    10:
      left-pointing wedge

    ==================================================
  */


  function drawOne(
    x,
    y,
    scale = 1
  ) {

    return `
      <g
        transform="
          translate(${x} ${y})
          scale(${scale})
        ">

        <path
          d="
            M0 0
            L16 0
            L11 7
            L9 26
            L7 26
            L5 7
            Z
          "
          fill="currentColor">
        </path>

        <path
          d="
            M5 7
            L11 7
            L8 12
            Z
          "
          fill="white">
        </path>

      </g>
    `;

  }


  function drawTen(
    x,
    y,
    scale = 1
  ) {

    return `
      <g
        transform="
          translate(${x} ${y})
          scale(${scale})
        ">

        <path
          d="
            M0 10
            L17 0
            L12 9
            L17 19
            Z
          "
          fill="currentColor">
        </path>

        <path
          d="
            M4 10
            L12 5
            L9 10
            L12 15
            Z
          "
          fill="white">
        </path>

      </g>
    `;

  }


  /*
    ==================================================
    SYMBOL ARRANGEMENT
    ==================================================

    Matches the textbook-style organization:

    1–3:
      one row

    4–6:
      three on the first row,
      remaining marks below

    7–9:
      three rows

    The same layout is used for tens.

    ==================================================
  */


  function getGridPositions(
    count,
    type
  ) {

    const positions =
      [];


    const horizontal =
      type === "ten";


    const columnGap =
      horizontal
        ? 22
        : 18;


    const rowGap =
      horizontal
        ? 22
        : 29;


    let remaining =
      count;


    let row =
      0;


    while (
      remaining >
      0
    ) {

      const marksInRow =
        Math.min(
          3,
          remaining
        );


      const width =
        (
          marksInRow -
          1
        ) *
        columnGap;


      const startX =
        -width /
        2;


      for (
        let column = 0;
        column < marksInRow;
        column++
      ) {

        positions.push({

          x:
            startX +
            column *
            columnGap,

          y:
            row *
            rowGap

        });

      }


      remaining -=
        marksInRow;


      row++;

    }


    return positions;

  }


  /*
    ==================================================
    DRAW A GROUP OF IDENTICAL SYMBOLS
    ==================================================
  */


  function createSymbolGroup(
    count,
    type
  ) {

    if (
      count <=
      0
    ) {

      return "";

    }


    const positions =
      getGridPositions(
        count,
        type
      );


    const rows =
      Math.ceil(
        count /
        3
      );


    const width =
      type === "ten"
        ? 78
        : 66;


    const height =
      type === "ten"

        ? Math.max(
            24,
            rows *
              22 +
              10
          )

        : Math.max(
            32,
            rows *
              29 +
              8
          );


    const centerX =
      width /
      2;


    const top =
      4;


    let marks =
      "";


    positions.forEach(
      position => {

        if (
          type ===
          "one"
        ) {

          marks +=
            drawOne(
              centerX +
                position.x -
                8,

              top +
                position.y,

              0.9
            );

        }

        else {

          marks +=
            drawTen(
              centerX +
                position.x -
                8,

              top +
                position.y,

              0.9
            );

        }

      }
    );


    return `
      <svg
        width="${width}"
        height="${height}"
        viewBox="0 0 ${width} ${height}"
        style="color: var(--text)"
        aria-hidden="true">

        ${marks}

      </svg>
    `;

  }


  /*
    ==================================================
    DRAW ONE BABYLONIAN DIGIT
    ==================================================

    Example:

    24 =
      two ten symbols
      four one symbols

    ==================================================
  */


  function renderDigit(
    value
  ) {

    const tens =
      Math.floor(
        value /
        10
      );


    const ones =
      value %
      10;


    return `
      <div class="babylonian-digit">

        ${
          tens
            ? createSymbolGroup(
                tens,
                "ten"
              )
            : ""
        }

        ${
          ones
            ? createSymbolGroup(
                ones,
                "one"
              )
            : ""
        }

      </div>
    `;

  }


  /*
    ==================================================
    CONVERT TO BASE 60
    ==================================================
  */


  function toBase60(
    value
  ) {

    const digits =
      [];


    let number =
      value;


    while (
      number >
      0
    ) {

      digits.unshift(
        number %
        60
      );


      number =
        Math.floor(
          number /
          60
        );

    }


    return digits.length
      ? digits
      : [0];

  }


  /*
    ==================================================
    RANDOM NUMBER
    ==================================================

    Approximately:

    80%  -> 1–999
    16%  -> 1,000–3,599
    4%   -> 3,600–10,000

    ==================================================
  */


  function generateWeightedNumber() {

    const random =
      Math.random();


    let number;


    if (
      random <
      0.80
    ) {

      number =
        1 +
        Math.floor(
          Math.random() *
          999
        );

    }

    else if (
      random <
      0.96
    ) {

      number =
        1000 +
        Math.floor(
          Math.random() *
          2600
        );

    }

    else {

      number =
        3600 +
        Math.floor(
          Math.random() *
          6401
        );

    }


    if (
      number >
      10000
    ) {

      number =
        10000;

    }


    return number;

  }


  /*
    ==================================================
    GENERATE PROBLEM
    ==================================================

    For now, zero base-60 places are
    avoided.

    That keeps the activity focused on
    reading the basic numeral system
    without introducing the Babylonian
    placeholder symbol.

    ==================================================
  */


  function generateProblem() {

    let number;

    let digits;


    do {

      number =
        generateWeightedNumber();


      digits =
        toBase60(
          number
        );

    }

    while (

      digits.some(
        digit =>
          digit === 0
      )

      ||

      number ===
        previousNumber

    );


    currentNumber =
      number;


    previousNumber =
      number;


    currentDigits =
      digits;

  }


  /*
    ==================================================
    DISPLAY PROBLEM
    ==================================================
  */


  function renderProblem() {

    babylonianDisplay.innerHTML =
      currentDigits
        .map(
          (
            digit,
            index
          ) => {

            return `
              <div
                class="place-group"
                aria-label="
                  Base sixty group
                  ${index + 1},
                  value ${digit}
                ">

                ${renderDigit(
                  digit
                )}

              </div>
            `;

          }
        )
        .join("");

  }


  /*
    ==================================================
    EXPLANATION
    ==================================================
  */


  function buildExplanation() {

    const numberOfPlaces =
      currentDigits.length;


    const contributions =
      [];


    let rows =
      "";


    currentDigits.forEach(
      (
        digit,
        index
      ) => {

        const power =
          numberOfPlaces -
          1 -
          index;


        const placeValue =
          Math.pow(
            60,
            power
          );


        const contribution =
          digit *
          placeValue;


        contributions.push(
          contribution
        );


        rows +=
          `
            <div class="break-row">

              <div>

                <div class="break-small">
                  Group value
                </div>

                <strong>
                  ${digit}
                </strong>

              </div>


              <div class="break-math">

                ${digit}
                ×
                ${placeValue.toLocaleString(
                  "en-US"
                )}

              </div>


              <div class="break-value">

                ${contribution.toLocaleString(
                  "en-US"
                )}

              </div>

            </div>
          `;

      }
    );


    return `
      <div class="explanation">

        <div class="explanation-title">

          Read each group, then multiply by
          its base-60 place value:

        </div>


        <div class="breakdown">
          ${rows}
        </div>


        <div class="sum-box">

          ${contributions
            .map(
              value =>
                value.toLocaleString(
                  "en-US"
                )
            )
            .join(" + ")}

          =

          ${currentNumber.toLocaleString(
            "en-US"
          )}

        </div>

      </div>
    `;

  }


  /*
    ==================================================
    NEW QUESTION
    ==================================================
  */


  function newQuestion() {

    generateProblem();

    renderProblem();


    answerInput.value =
      "";


    answerInput.disabled =
      false;


    checkButton.disabled =
      false;


    feedbackElement.className =
      "feedback";


    feedbackElement.innerHTML =
      "";


    answerInput.focus();

  }


  /*
    ==================================================
    CHECK ANSWER
    ==================================================
  */


  function checkAnswer() {

    const rawAnswer =
      answerInput.value.trim();


    /*
      Blank
    */

    if (
      rawAnswer ===
      ""
    ) {

      feedbackElement.className =
        "feedback incorrect";


      feedbackElement.innerHTML =
        `
          <div class="feedback-head">

            <strong>
              Enter a number first.
            </strong>

          </div>
        `;


      return;

    }


    const studentAnswer =
      Number(
        rawAnswer
      );


    /*
      Invalid
    */

    if (
      !Number.isInteger(
        studentAnswer
      )

      ||

      studentAnswer <
        0
    ) {

      feedbackElement.className =
        "feedback incorrect";


      feedbackElement.innerHTML =
        `
          <div class="feedback-head">

            <strong>
              Enter a whole number.
            </strong>

          </div>
        `;


      return;

    }


    /*
      Correct
    */

    if (
      studentAnswer ===
      currentNumber
    ) {

      feedbackElement.className =
        "feedback correct";


      feedbackElement.innerHTML =
        `
          <strong>
            ✓ Correct!
          </strong>

          The Babylonian numeral represents

          ${currentNumber.toLocaleString(
            "en-US"
          )}.
        `;


      answerInput.disabled =
        true;


      checkButton.disabled =
        true;


      return;

    }


    /*
      Incorrect
    */

    feedbackElement.className =
      "feedback incorrect";


    feedbackElement.innerHTML =
      `
        <div class="feedback-head">

          <strong>
            Not quite.
          </strong>

          This Babylonian numeral does not equal

          ${studentAnswer.toLocaleString(
            "en-US"
          )}.

        </div>

        ${buildExplanation()}
      `;

  }


  /*
    ==================================================
    INPUT
    ==================================================
  */


  answerInput.addEventListener(
    "input",

    function () {

      answerInput.value =
        answerInput.value.replace(
          /[^0-9]/g,
          ""
        );


      feedbackElement.className =
        "feedback";


      feedbackElement.innerHTML =
        "";

    }
  );


  answerInput.addEventListener(
    "keydown",

    function (
      event
    ) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        checkAnswer();

      }

    }
  );


  /*
    ==================================================
    BUTTONS
    ==================================================
  */


  checkButton.addEventListener(
    "click",
    checkAnswer
  );


  nextButton.addEventListener(
    "click",
    newQuestion
  );


  /*
    ==================================================
    REFERENCE SYMBOLS
    ==================================================
  */


  oneReference.innerHTML =
    createSymbolGroup(
      1,
      "one"
    );


  tenReference.innerHTML =
    createSymbolGroup(
      1,
      "ten"
    );


  /*
    ==================================================
    START
    ==================================================
  */


  newQuestion();

})();
</script>

</body>
</html>
